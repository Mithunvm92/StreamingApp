apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: streamingapp-eks
  region: ap-south-1
  version: "1.33"

iam:
  withOIDC: true

managedNodeGroups:
  - name: streamingapp-ng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false
    labels:
      workload: streamingapp

vpc:
  cidr: 192.168.0.0/16
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: false
