{{- $services := list
  (dict "key" "auth" "image" "streamingapp-auth" "port" 3001)
  (dict "key" "streaming" "image" "streamingapp-streaming" "port" 3002)
  (dict "key" "admin" "image" "streamingapp-admin" "port" 3003)
  (dict "key" "chat" "image" "streamingapp-chat" "port" 3004)
}}

{{- range $svc := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" $ }}-{{ $svc.key }}
  labels:
    app: {{ include "streamingapp.name" $ }}
    component: {{ $svc.key }}
spec:
  replicas: {{ index $.Values.replicaCount $svc.key }}
  selector:
    matchLabels:
      app: {{ include "streamingapp.name" $ }}
      component: {{ $svc.key }}
  template:
    metadata:
      labels:
        app: {{ include "streamingapp.name" $ }}
        component: {{ $svc.key }}
    spec:
      containers:
        - name: {{ $svc.key }}
          image: "{{ $.Values.image.registry }}/{{ $svc.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: MONGO_URI
              value: "mongodb://{{ $.Values.services.mongo.name }}:27017/{{ $.Values.mongodb.database }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" $ }}-secret
                  key: JWT_SECRET
            - name: CLIENT_URLS
              value: "*"
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ index $.Values.services $svc.key "name" }}
  labels:
    app: {{ include "streamingapp.name" $ }}
    component: {{ $svc.key }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "streamingapp.name" $ }}
    component: {{ $svc.key }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
