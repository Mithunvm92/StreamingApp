{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "streamingapp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api/streaming
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.streaming.name }}
                port:
                  number: {{ .Values.services.streaming.port }}

          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.admin.name }}
                port:
                  number: {{ .Values.services.admin.port }}

          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.chat.name }}
                port:
                  number: {{ .Values.services.chat.port }}

          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.chat.name }}
                port:
                  number: {{ .Values.services.chat.port }}

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.auth.name }}
                port:
                  number: {{ .Values.services.auth.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.frontend.name }}
                port:
                  number: {{ .Values.services.frontend.port }}
{{- end }}
