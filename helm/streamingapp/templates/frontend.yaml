apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" . }}-frontend
  labels:
    app: {{ include "streamingapp.name" . }}
    component: frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app: {{ include "streamingapp.name" . }}
      component: frontend
  template:
    metadata:
      labels:
        app: {{ include "streamingapp.name" . }}
        component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/streamingapp-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.frontend.name }}
  labels:
    app: {{ include "streamingapp.name" . }}
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: {{ include "streamingapp.name" . }}
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
